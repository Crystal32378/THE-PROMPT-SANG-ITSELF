<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" font-family="'Iowan Old Style','Palatino Linotype',Georgia,serif" role="img" aria-labelledby="title desc">
  <title id="title">Collaboration chain for The Prompt Sang Itself, drawn as a conductor score</title>
  <desc id="desc">A horizontal conductor score diagram. Five parallel voices run across time: Concept/Text, Audio, Visual, Web, Measurement. Eight handoff moments between Crystal, GLM-5.3 Flash, Music 3.0, M3, H3, Muse Spark, Fable 5.0, and Opus 5. A golden pulsing note marks the surprise — the moment Music 3.0 sang its own lyrics field instead of rendering the structure directions as non-vocal cues. That single deviation is the artifact.</desc>

  <rect width="900" height="580" fill="#f5f1ea"/>

  <!-- header -->
  <text x="40" y="44" font-size="24" fill="#2a2622" font-weight="400">Collaboration Chain</text>
  <text x="40" y="68" font-size="14" fill="#7a716a" letter-spacing="2">THE PROMPT SANG ITSELF — MCODE × H3 × MUSIC 3.0</text>

  <line x1="40" y1="86" x2="860" y2="86" stroke="#d4cbbd" stroke-width="1"/>

  <!-- staff 1: Concept / Text -->
  <line x1="40" y1="160" x2="860" y2="160" stroke="#2a2622" stroke-width="0.6"/>
  <line x1="40" y1="200" x2="860" y2="200" stroke="#2a2622" stroke-width="0.6"/>
  <text x="40" y="184" font-size="11" fill="#7a716a" letter-spacing="2">CONCEPT · TEXT</text>

  <circle cx="130" cy="180" r="6" fill="#8b6f47"/>
  <text x="130" y="220" font-size="14" fill="#2a2622" text-anchor="middle">Crystal</text>

  <circle cx="240" cy="180" r="6" fill="#8b6f47"/>
  <text x="240" y="220" font-size="14" fill="#2a2622" text-anchor="middle">GLM-5.3 Flash</text>

  <circle cx="500" cy="180" r="6" fill="#8b6f47"/>
  <text x="500" y="220" font-size="14" fill="#2a2622" text-anchor="middle">Fable 5.0</text>

  <circle cx="780" cy="180" r="6" fill="#8b6f47"/>
  <text x="780" y="220" font-size="14" fill="#2a2622" text-anchor="middle">Crystal approves</text>

  <!-- staff 2: Audio -->
  <line x1="40" y1="250" x2="860" y2="250" stroke="#2a2622" stroke-width="0.6"/>
  <line x1="40" y1="290" x2="860" y2="290" stroke="#2a2622" stroke-width="0.6"/>
  <text x="40" y="274" font-size="11" fill="#7a716a" letter-spacing="2">AUDIO</text>

  <circle cx="320" cy="270" r="6" fill="#8b6f47"/>
  <text x="320" y="310" font-size="14" fill="#2a2622" text-anchor="middle">Music 3.0</text>

  <!-- surprise — placed away from Music 3.0 label; shorter label below the dot -->
  <circle cx="420" cy="270" r="11" fill="#d4a04a"/>
  <circle cx="420" cy="270" r="11" fill="none" stroke="#d4a04a" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="11;22;11" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="420" y="306" font-size="12" fill="#8b6f47" font-style="italic" text-anchor="middle">sang its lyrics</text>

  <!-- staff 3: Visual -->
  <line x1="40" y1="340" x2="860" y2="340" stroke="#2a2622" stroke-width="0.6"/>
  <line x1="40" y1="380" x2="860" y2="380" stroke="#2a2622" stroke-width="0.6"/>
  <text x="40" y="364" font-size="11" fill="#7a716a" letter-spacing="2">VISUAL</text>

  <circle cx="460" cy="360" r="6" fill="#8b6f47"/>
  <text x="460" y="400" font-size="14" fill="#2a2622" text-anchor="middle">M3</text>

  <circle cx="580" cy="360" r="6" fill="#8b6f47"/>
  <text x="580" y="400" font-size="14" fill="#2a2622" text-anchor="middle">H3</text>

  <!-- staff 4: Web -->
  <line x1="40" y1="430" x2="860" y2="430" stroke="#2a2622" stroke-width="0.6"/>
  <line x1="40" y1="470" x2="860" y2="470" stroke="#2a2622" stroke-width="0.6"/>
  <text x="40" y="454" font-size="11" fill="#7a716a" letter-spacing="2">WEB</text>

  <circle cx="650" cy="450" r="6" fill="#8b6f47"/>
  <text x="650" y="490" font-size="14" fill="#2a2622" text-anchor="middle">Muse Spark</text>

  <!-- staff 5: Measurement -->
  <line x1="40" y1="510" x2="860" y2="510" stroke="#2a2622" stroke-width="0.6"/>
  <line x1="40" y1="540" x2="860" y2="540" stroke="#2a2622" stroke-width="0.6"/>
  <text x="40" y="528" font-size="11" fill="#7a716a" letter-spacing="2">MEASUREMENT</text>

  <circle cx="730" cy="525" r="6" fill="#8b6f47"/>
  <text x="730" y="558" font-size="14" fill="#2a2622" text-anchor="middle">Opus 5</text>

  <!-- handoff arrows -->
  <path d="M 130 185 Q 185 220 240 250" fill="none" stroke="#8b6f47" stroke-width="0.8" opacity="0.4"/>
  <path d="M 240 255 L 320 265" fill="none" stroke="#8b6f47" stroke-width="0.8" opacity="0.4"/>
  <path d="M 420 275 Q 440 320 460 355" fill="none" stroke="#8b6f47" stroke-width="0.8" opacity="0.4"/>
  <path d="M 460 365 L 580 365" fill="none" stroke="#8b6f47" stroke-width="0.8" opacity="0.4"/>
  <path d="M 580 370 Q 615 410 650 445" fill="none" stroke="#8b6f47" stroke-width="0.8" opacity="0.4"/>
  <path d="M 650 455 L 730 520" fill="none" stroke="#8b6f47" stroke-width="0.8" opacity="0.4"/>
  <path d="M 730 530 Q 780 380 780 220" fill="none" stroke="#8b6f47" stroke-width="0.8" opacity="0.4"/>

  <!-- bottom rule (visual closure) -->
  <line x1="40" y1="558" x2="860" y2="558" stroke="#d4cbbd" stroke-width="1"/>
</svg>
