<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200"
     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-labelledby="gram-title gram-desc">
  <title id="gram-title">A 1920s acoustic horn gramophone, drawn as a line diagram</title>
  <desc id="gram-desc">A side-elevation line drawing of a hand-cranked gramophone: a wide flared brass horn
    opening to the upper right, a short curved neck descending to a wooden turntable base with a crank handle.
    The mouth of the horn is empty — the digital waveform is drawn live from its rim.</desc>

  <g id="gram-horn">
    <!-- bell: two tangent lines from the throat to the rim, bowed outward for flare -->
    <path d="M 147.9 64.8 Q 153.9 82.6 150 101 Q 170.1 91.7 192.2 92.1" />
    <!-- rim of the mouth -->
    <ellipse cx="190" cy="56" rx="44" ry="35" transform="rotate(-28 190 56)" />
    <!-- interior of the cone, converging toward the throat -->
    <ellipse cx="184" cy="62.7" rx="29" ry="23.1" transform="rotate(-28 184 62.7)" />
    <ellipse cx="177.4" cy="70.2" rx="15" ry="11.9" transform="rotate(-28 177.4 70.2)" />
  </g>

  <g id="gram-neck">
    <path d="M 143 105 C 130 125 112 137 90 141" />
    <path d="M 158 99 C 145 121 124 135 99 143" />
  </g>

  <g id="gram-base">
    <ellipse cx="78" cy="142" rx="48" ry="11" />
    <path d="M 32 143 L 124 143 L 132 172 L 24 172 Z" />
    <path d="M 28 158 L 128 158" />
    <path d="M 114 135 L 81 133" />
    <circle cx="78" cy="133" r="3.2" />
    <circle cx="127" cy="155" r="3.4" />
    <path d="M 130 154 L 151 149" />
    <path d="M 151 149 L 151 142" />
    <circle cx="151" cy="139" r="4.4" />
  </g>
</svg>
